<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spenden – Lebensbrücke Deutschland</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8fb;
  color: #174f72;
}

header {
  background: white;
  text-align: center;
  padding: 42px 20px 30px;
}

h1 {
  font-size: 34px;
  margin: 0 0 12px;
}

header p {
  font-size: 21px;
  color: #555;
  margin: 0;
}

main {
  max-width: 700px;
  margin: auto;
  padding: 25px 20px;
}

.donation-box {
  background: white;
  border-radius: 22px;
  padding: 25px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.09);
}

h2 {
  text-align: center;
  font-size: 24px;
  margin-top: 5px;
}

.amounts,
.frequency {
  display: grid;
  gap: 12px;
  margin: 18px 0 28px;
}

.amounts {
  grid-template-columns: repeat(2, 1fr);
}

.frequency {
  grid-template-columns: repeat(3, 1fr);
}

button {
  border: 2px solid #174f72;
  background: white;
  color: #174f72;
  border-radius: 14px;
  padding: 15px 5px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button.selected {
  background: #174f72;
  color: white;
}

.custom {
  grid-column: 1 / -1;
}

.donate {
  width: 100%;
  background: #d94b5b;
  border: none;
  color: white;
  font-size: 22px;
  padding: 18px;
  border-radius: 16px;
}

.note {
  text-align: center;
  color: #666;
  font-size: 16px;
  line-height: 1.5;
  margin-top: 22px;
}

.back {
  display: block;
  text-align: center;
  margin: 30px 0;
  color: #555;
  font-size: 18px;
}

</style>
</head>

<body>

<header>
  <h1>❤️ Hilf uns, Menschen und Tieren zu helfen.</h1>
  <p>Jeder Beitrag kann etwas bewegen.</p>
</header>

<main>

<div class="donation-box">

  <h2>Wähle deinen Spendenbetrag</h2>

  <div class="amounts">
    <button onclick="selectButton(this)">5 €</button>
    <button onclick="selectButton(this)">10 €</button>
    <button onclick="selectButton(this)">25 €</button>
    <button onclick="selectButton(this)">50 €</button>
    <button class="custom" onclick="selectButton(this)">✏️ Eigener Betrag</button>
  </div>

  <h2>Wie möchtest du helfen?</h2>

  <div class="frequency">
    <button onclick="selectFrequency(this)">Einmalig</button>
    <button onclick="selectFrequency(this)">Monatlich</button>
    <button onclick="selectFrequency(this)">Jährlich</button>
  </div>

  <button class="donate">❤️ Jetzt spenden</button>

  <p class="note">
    Deine Unterstützung hilft uns dabei, Menschen und Tiere dort zu unterstützen,
    wo Hilfe dringend benötigt wird.
  </p>

</div>

<a class="back" href="index.html">← Zurück zur Startseite</a>

</main>

<script>
function selectButton(button) {
  document.querySelectorAll('.amounts button').forEach(b =>
    b.classList.remove('selected')
  );
  button.classList.add('selected');
}

function selectFrequency(button) {
  document.querySelectorAll('.frequency button').forEach(b =>
    b.classList.remove('selected')
  );
  button.classList.add('selected');
}
</script>

</body>
</html>
